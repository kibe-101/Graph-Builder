kind = "web"
previewPath = "/"
title = "WLAN Simulation GUI"
version = "1.0.0"
id = "artifacts/wlan-gui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25989

[services.development]
run = "pnpm --filter @workspace/wlan-gui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wlan-gui", "run", "build" ]
publicDir = "artifacts/wlan-gui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25989"
BASE_PATH = "/"
